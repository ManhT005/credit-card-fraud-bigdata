name: Python checks

on:
  push:
    branches: [main, develop, chore/project-skeleton, "feature/phase-*"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project with data and test tools
        run: python -m pip install -e ".[data,ml,notebook,dev]"
      - name: Test
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check src tests dashboard scripts

  phase-1-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install data and notebook environment
        run: python -m pip install -e ".[data,notebook,dev]"
      - name: Verify OpenML source and execute original-data notebook
        env:
          MPLBACKEND: Agg
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/phase_01_acceptance.py
      - name: Save aggregate evidence (no source transactions)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-1-acceptance
          path: artifacts/phase_01/
          if-no-files-found: error
          retention-days: 30

  phase-2-acceptance:
    needs: phase-1-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install reproducible experiment environment
        run: python -m pip install -e ".[data,ml,notebook,dev]"
      - name: Receive successful source evidence from this workflow
        uses: actions/download-artifact@v4
        with:
          name: phase-1-acceptance
          path: artifacts/phase_01
      - name: Original-source modeling and notebook acceptance
        env:
          MPLBACKEND: Agg
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
        run: python scripts/phase_02_acceptance.py --download-source --execute-notebooks
      - name: Save aggregate Phase 2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-2-acceptance
          path: |
            artifacts/phase_02/acceptance.json
            artifacts/phase_02/dataset_intake.json
            artifacts/phase_02/split_manifest.json
            artifacts/phase_02/reference_split_manifest.json
            artifacts/phase_02/experiment.json
            artifacts/phase_02/candidate_proposal.json
            artifacts/phase_02/model_comparison.csv
            artifacts/phase_02/runs/*/*.json
            artifacts/phase_02/reference/*.json
            artifacts/phase_02/reference/model_comparison.csv
            artifacts/phase_02/reference/runs/*/*.json
            artifacts/phase_02/notebooks/*.ipynb
          if-no-files-found: error
          retention-days: 30
