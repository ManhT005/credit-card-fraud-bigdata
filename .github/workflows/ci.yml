name: Python checks

on:
  push:
    branches: [main, develop, chore/project-skeleton, "feature/phase-*"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project with data and test tools
        run: python -m pip install -e ".[data,dev]"
      - name: Test
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check src tests dashboard scripts
