name: Python checks

on:
  push:
    branches: [main, develop, chore/project-skeleton, "feature/phase-*"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"
      - name: Install project with data and test tools
        run: |
          python -m pip install -r requirements/phase-02-linux-py311.txt
          python -m pip install --no-build-isolation --no-deps -e ".[data,ml,notebook,dev]"
          python -m pip check
      - name: Test
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check src tests dashboard scripts

  phase-1-acceptance:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"
      - name: Install data and notebook environment
        run: |
          python -m pip install -r requirements/phase-02-linux-py311.txt
          python -m pip install --no-build-isolation --no-deps -e ".[data,ml,notebook,dev]"
          python -m pip check
      - name: Verify OpenML source and execute original-data notebook
        env:
          MPLBACKEND: Agg
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/phase_01_acceptance.py
      - name: Save aggregate evidence (no source transactions)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-1-acceptance
          path: artifacts/phase_01/
          if-no-files-found: error
          retention-days: 30

  phase-2-acceptance:
    needs: phase-1-acceptance
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"
      - name: Install reproducible experiment environment
        run: |
          python -m pip install -r requirements/phase-02-linux-py311.txt
          python -m pip install --no-build-isolation --no-deps -e ".[data,ml,notebook,dev]"
          python -m pip check
      - name: Receive successful source evidence from this workflow
        uses: actions/download-artifact@v4
        with:
          name: phase-1-acceptance
          path: artifacts/phase_01
      - name: Original-source modeling and notebook acceptance
        env:
          MPLBACKEND: Agg
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
        run: |
          python scripts/phase_02_acceptance.py --download-source
          cp artifacts/phase_02/candidate_proposal.json "$RUNNER_TEMP/phase-02-first-proposal.json"
          python scripts/phase_02_acceptance.py --execute-notebooks
          cmp "$RUNNER_TEMP/phase-02-first-proposal.json" artifacts/phase_02/candidate_proposal.json
          python scripts/phase_05_verify.py --phase2-dir artifacts/phase_02
      - name: Save aggregate Phase 2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-2-acceptance
          path: |
            artifacts/phase_02/acceptance.json
            artifacts/phase_02/dataset_intake.json
            artifacts/phase_02/split_manifest.json
            artifacts/phase_02/reference_split_manifest.json
            artifacts/phase_02/experiment.json
            artifacts/phase_02/candidate_proposal.json
            artifacts/phase_02/model_comparison.csv
            artifacts/phase_02/runs/*/*.json
            artifacts/phase_02/reference/*.json
            artifacts/phase_02/reference/model_comparison.csv
            artifacts/phase_02/reference/runs/*/*.json
            artifacts/phase_02/notebooks/*.ipynb
          if-no-files-found: error
          retention-days: 30

  phase-3-acceptance:
    needs: phase-1-acceptance
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Phase 3 runtime and source tools
        run: |
          python -m pip install -r requirements/phase-02-linux-py311.txt
          python -m pip install -r infra/docker/requirements.txt
          python -m pip install --no-build-isolation --no-deps -e ".[data,notebook,dev,spark]"
          python -m pip check
      - name: Receive verified original-source evidence
        uses: actions/download-artifact@v4
        with:
          name: phase-1-acceptance
          path: artifacts/phase_01
      - name: Check parity and benchmark original data at 1x
        env:
          SPARK_LOCAL_IP: 127.0.0.1
        run: |
          python -m pytest -q tests/test_phase_03_etl.py
          PYTHONPATH=scripts python -c 'from phase_01_acceptance import acquire_source, ROOT; acquire_source(ROOT / "data/raw")'
          python scripts/phase_03_benchmark.py --scales 1 --repeats 2
      - name: Run original 1x in the Compose master and two-worker topology
        env:
          COMPOSE_FILE: infra/docker/compose.yaml
        run: |
          mkdir -p artifacts/phase_03
          docker compose up -d --build --scale worker=2 worker
          docker compose run --rm --use-aliases benchmark python scripts/phase_03_benchmark.py \
            --master spark://master:7077 --scales 1 --repeats 1 \
            --output artifacts/phase_03/standalone.json
      - name: Verify local and standalone ETL evidence
        run: |
          python scripts/phase_05_verify.py --benchmark artifacts/phase_03/benchmark.json \
            --benchmark artifacts/phase_03/standalone.json
      - name: Stop Compose cluster
        if: always()
        env:
          COMPOSE_FILE: infra/docker/compose.yaml
        run: docker compose down
      - name: Publish aggregate benchmark evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase-3-acceptance
          path: |
            artifacts/phase_03/benchmark.json
            artifacts/phase_03/standalone.json
          if-no-files-found: error
          retention-days: 30

  phase-4-dashboard:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"
      - name: Install dashboard and test dependencies
        run: |
          python -m pip install -c requirements/dashboard-constraints.txt -e ".[dashboard,dev]"
          python -m pip check
      - name: Verify published evidence and render dashboard tabs
        run: |
          mkdir -p artifacts/release_demo
          git rev-parse HEAD > artifacts/release_demo/checkout-sha.txt
          printf '%s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            > artifacts/release_demo/run-url.txt
          python --version > artifacts/release_demo/python-version.txt
          python -m pip freeze --exclude-editable > artifacts/release_demo/dependencies.txt
          python scripts/phase_05_verify.py | tee artifacts/release_demo/evidence.json
          python -m pytest -q tests/test_phase_04_dashboard.py \
            --junitxml=artifacts/release_demo/dashboard-tests.xml
      - name: Start Streamlit and check the HTTP health endpoint
        run: |
          python -m streamlit run dashboard/app.py --server.address 127.0.0.1 \
            --server.headless true > artifacts/release_demo/streamlit.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:8501/_stcore/health \
              > artifacts/release_demo/streamlit-health.txt; then
              break
            fi
            kill -0 "$pid"
            sleep 1
          done
          test "$(cat artifacts/release_demo/streamlit-health.txt)" = ok
      - name: Publish release demo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-demo-acceptance
          path: artifacts/release_demo/
          if-no-files-found: error
          retention-days: 30
