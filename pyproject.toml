[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-card-fraud-bigdata"
version = "0.1.0"
description = "Reproducible Big Data and imbalanced ML research scaffold"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
data = ["pandas>=2.1", "pyarrow>=14", "openml>=0.14", "PyYAML>=6"]
ml = ["numpy>=1.26", "scikit-learn>=1.4", "imbalanced-learn>=0.12", "xgboost>=2.0", "matplotlib>=3.8"]
notebook = ["notebook>=7", "ipykernel>=6", "nbclient>=0.10", "nbformat>=5.10", "matplotlib>=3.8", "scipy>=1.11"]
spark = ["pyspark>=3.5,<5"]
dashboard = ["streamlit>=1.35"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
fraud-bigdata = "fraud_detection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
